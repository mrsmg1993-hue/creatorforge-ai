<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>CreatorForge AI — Sua ideia. Seu vídeo. Criado com IA.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07020f;
    --surface:#120a26;
    --surface2:#150a2e;
    --border:#2a1a4a;
    --border-soft:#1e1040;
    --purple:#a855f7;
    --purple-deep:#7c3aed;
    --blue:#3b82f6;
    --white:#f5f3ff;
    --muted:#9d94b8;
    --gold:#facc15;
    --danger:#f87171;
    --success:#4ade80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--white);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 64px;}
  header{display:flex;align-items:center;gap:12px;padding:8px 0 6px;}
  header h1{font-size:19px;font-weight:700;margin:0;line-height:1.1;}
  header p{font-size:11px;color:#c4b5fd;margin:2px 0 0;letter-spacing:.02em;}

  .usage-card{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:14px;margin:18px 0 22px;
  }
  .usage-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .usage-row span:first-child{font-size:12px;color:var(--muted);}
  .usage-row span:last-child{font-size:14px;font-weight:700;color:var(--purple);}
  .bar{height:6px;width:100%;background:var(--border-soft);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:99px;transition:width .4s ease;}

  section{margin-bottom:20px;}
  label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chips.grid3{display:grid;grid-template-columns:repeat(3,1fr);}
  .chips.grid4{display:grid;grid-template-columns:repeat(4,1fr);}
  .chip{
    padding:12px 14px;border-radius:12px;font-size:13px;font-weight:600;
    background:var(--surface2);border:1px solid var(--border);color:#d1c9e8;
    cursor:pointer;transition:.15s ease;text-align:center;
  }
  .chip:active{transform:scale(.96);}
  .chip.active{
    background:linear-gradient(135deg,var(--purple-deep),var(--blue));
    border-color:var(--purple);color:#fff;
    box-shadow:0 6px 18px -6px rgba(124,58,237,.6);
  }

  textarea{
    width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px;color:var(--white);font-family:inherit;font-size:14px;resize:none;
  }
  textarea::placeholder{color:#655a80;}
  textarea:focus{outline:none;border-color:var(--purple);}

  .generate-btn{
    width:100%;padding:17px;border:none;border-radius:18px;cursor:pointer;
    background:linear-gradient(90deg,var(--purple-deep),var(--purple),var(--blue));
    color:#fff;font-size:15px;font-weight:700;letter-spacing:.03em;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 10px 30px -10px rgba(124,58,237,.7);
  }
  .generate-btn:active{transform:scale(.98);}
  .generate-btn:disabled{opacity:.6;cursor:default;}

  .limit-box{
    background:#2a0a1a;border:1px solid #7f1d1d;border-radius:18px;padding:16px;text-align:center;
  }
  .limit-box p:first-child{font-size:14px;font-weight:700;color:var(--danger);margin:0 0 4px;}
  .limit-box p:last-child{font-size:12px;color:var(--muted);margin:0;}

  .error-msg{font-size:12px;color:var(--danger);text-align:center;margin-top:10px;}

  .results{margin-top:30px;}
  .results-title{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .results-title h2{font-size:16px;margin:0;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:12px;
  }
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .card-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.03em;}
  .card-icon{width:26px;height:26px;border-radius:8px;background:rgba(139,92,246,.15);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .card-body{font-size:14px;color:#d8d2ec;line-height:1.55;}
  .copy-btn{
    display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:9px;
    background:var(--border-soft);border:1px solid var(--border);color:#c4b5fd;
    font-size:11px;font-weight:600;cursor:pointer;
  }
  .copy-btn:active{transform:scale(.95);}

  .titulo-item{display:flex;gap:8px;margin-bottom:6px;}
  .titulo-num{font-size:11px;color:var(--purple);margin-top:2px;}

  .roteiro-item{display:flex;gap:10px;margin-bottom:10px;}
  .roteiro-time{font-size:10px;color:#93c5fd;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);border-radius:7px;padding:2px 7px;height:fit-content;white-space:nowrap;}

  .tag-list{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-size:12px;color:#93c5fd;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);border-radius:99px;padding:4px 10px;}
  .screen-text{font-size:12px;background:var(--border-soft);border:1px solid var(--border);border-radius:9px;padding:6px 10px;}

  ul.plain{margin:0;padding-left:18px;}
  ul.plain li{margin-bottom:5px;}

  .regen-btn{
    width:100%;padding:14px;border-radius:16px;background:var(--surface2);
    border:1px solid #5b21b6;color:#fff;font-weight:700;font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;
  }
  .regen-btn:active{transform:scale(.98);}

  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .account-btn{
    margin-left:auto;padding:9px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface2);color:#d1c9e8;font-size:12px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .account-btn:active{transform:scale(.96);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(5,2,12,.75);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-sheet{
    width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);
    border-radius:24px 24px 0 0;padding:24px 20px 32px;max-height:88vh;overflow-y:auto;
  }
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px;}
  .modal-title{font-size:18px;font-weight:700;margin:0 0 4px;}
  .modal-sub{font-size:12px;color:var(--muted);margin:0 0 20px;}
  .modal-close{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}

  .field{margin-bottom:12px;}
  .field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .field input{
    width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;
    padding:13px 14px;color:var(--white);font-size:14px;font-family:inherit;
  }
  .field input:focus{outline:none;border-color:var(--purple);}

  .auth-submit{
    width:100%;padding:15px;border:none;border-radius:14px;margin-top:6px;
    background:linear-gradient(90deg,var(--purple-deep),var(--purple),var(--blue));
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  }
  .auth-submit:active{transform:scale(.98);}
  .auth-switch{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;}
  .auth-switch button{background:none;border:none;color:var(--purple);font-weight:700;font-size:12px;cursor:pointer;padding:0;}
  .auth-error{font-size:12px;color:var(--danger);text-align:center;margin-top:10px;}
  .auth-success{font-size:12px;color:var(--success);text-align:center;margin-top:10px;}

  .account-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;
    display:flex;align-items:center;gap:12px;margin-bottom:16px;
  }
  .account-avatar{
    width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple-deep),var(--blue));
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;
  }
  .account-info{flex:1;min-width:0;}
  .account-info .name{font-size:13px;font-weight:700;}
  .account-info .email{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .logout-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:7px 11px;border-radius:9px;cursor:pointer;}

  .plans-toggle{
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:12px;color:var(--purple);font-weight:600;margin:22px 0 14px;cursor:pointer;
  }
  .plan-card{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;
    position:relative;
  }
  .plan-card.featured{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple);}
  .plan-badge{
    position:absolute;top:-10px;right:16px;background:linear-gradient(90deg,var(--purple-deep),var(--blue));
    font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.03em;
  }
  .plan-name{font-size:14px;font-weight:700;margin:0 0 2px;}
  .plan-price{font-size:22px;font-weight:800;margin:4px 0;}
  .plan-price span{font-size:12px;font-weight:500;color:var(--muted);}
  .plan-desc{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .plan-btn{
    width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);
    color:#fff;font-weight:700;font-size:13px;cursor:pointer;
  }
  .plan-btn.primary{border:none;background:linear-gradient(90deg,var(--purple-deep),var(--purple),var(--blue));}
  .plan-btn:disabled{opacity:.5;}
  .plan-current{font-size:11px;color:var(--success);text-align:center;font-weight:700;padding:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="42" height="42" viewBox="0 0 48 48" fill="none">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="48" y2="48">
          <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#3b82f6"/>
        </linearGradient>
      </defs>
      <g stroke="url(#g)" stroke-width="2.5" stroke-linecap="round" id="teeth"></g>
      <circle cx="24" cy="24" r="15" fill="#0a0118" stroke="url(#g)" stroke-width="2"/>
      <path d="M20 16.5L31 24L20 31.5V16.5Z" fill="url(#g)"/>
      <path d="M34 6L36 12L42 14L36 16L34 22L32 16L26 14L32 12L34 6Z" fill="#facc15"/>
    </svg>
    <div>
      <h1 class="display">CreatorForge AI</h1>
      <p>Sua ideia. Seu vídeo. Criado com IA.</p>
    </div>
    <button class="account-btn" id="accountBtn">👤 Entrar</button>
  </header>

  <div id="accountArea"></div>

  <div class="usage-card">
    <div class="usage-row">
      <span class="mono">Gerações restantes</span>
      <span class="mono" id="usageLabel">5/5</span>
    </div>
    <div class="bar"><div class="bar-fill" id="usageBar" style="width:100%"></div></div>
  </div>

  <div class="plans-toggle" id="plansToggle">💎 Ver planos premium</div>
  <div id="plansArea"></div>

  <section>
    <label>Plataforma</label>
    <div class="chips grid3" id="platformChips"></div>
  </section>

  <section>
    <label>Nicho</label>
    <div class="chips" id="nicheChips"></div>
  </section>

  <section>
    <label>Tema do vídeo</label>
    <textarea id="themeInput" rows="3" placeholder="Ex: 5 erros que iniciantes cometem no Valorant..."></textarea>
  </section>

  <section>
    <label>Duração</label>
    <div class="chips grid4" id="durationChips"></div>
  </section>

  <section>
    <label>Estilo</label>
    <div class="chips" id="styleChips"></div>
  </section>

  <div id="actionArea"></div>

  <div id="resultsArea"></div>
</div>

<div id="authModalRoot"></div>

<script>
const PLATFORMS = [["tiktok","TikTok"],["shorts","YouTube Shorts"],["reels","Instagram Reels"]];
const NICHES = ["Gaming","Humor","Tecnologia","Educação","Música","Vlog","Outro"];
const DURATIONS = [["15","15s"],["30","30s"],["60","60s"],["90","90s"]];
const STYLES = ["Engraçado","Viral","Informativo","Cinematográfico","Casual","Energético","Storytelling"];
const DAILY_LIMIT = 5;
const STORAGE_KEY = "creatorforge_usage";

let state = { platform:"tiktok", niche:"Gaming", theme:"", duration:"30", style:"Viral", loading:false, result:null };

// gear teeth
const teeth = document.getElementById("teeth");
for(let i=0;i<8;i++){
  const angle = i*Math.PI/4;
  const x1 = 24+Math.cos(angle)*17, y1 = 24+Math.sin(angle)*17;
  const x2 = 24+Math.cos(angle)*21, y2 = 24+Math.sin(angle)*21;
  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",x1);line.setAttribute("y1",y1);line.setAttribute("x2",x2);line.setAttribute("y2",y2);
  teeth.appendChild(line);
}

// ===== AUTENTICAÇÃO (Supabase) =====
const AUTH_KEY = "creatorforge_session";
let authConfig = null;
let authMode = "login"; // ou "signup"
let authModalOpen = false;

async function getAuthConfig(){
  if(authConfig) return authConfig;
  const res = await fetch("/api/config");
  authConfig = await res.json();
  return authConfig;
}

function getSession(){
  try{ return JSON.parse(localStorage.getItem(AUTH_KEY)); }catch(e){ return null; }
}
function setSession(session){ localStorage.setItem(AUTH_KEY, JSON.stringify(session)); }
function clearSession(){ localStorage.removeItem(AUTH_KEY); }

function openAuthModal(mode){
  authMode = mode || "login";
  authModalOpen = true;
  renderAuthModal();
}
function closeAuthModal(){
  authModalOpen = false;
  document.getElementById("authModalRoot").innerHTML = "";
}

function renderAuthModal(){
  const root = document.getElementById("authModalRoot");
  if(!authModalOpen){ root.innerHTML=""; return; }

  const isSignup = authMode === "signup";
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-sheet">
        <button class="modal-close" id="modalCloseBtn">✕</button>
        <div class="modal-handle"></div>
        <h2 class="modal-title display">${isSignup ? "Criar conta" : "Entrar"}</h2>
        <p class="modal-sub">${isSignup ? "Crie sua conta gratuita no CreatorForge AI" : "Bem-vindo de volta"}</p>

        ${isSignup ? `
        <div class="field">
          <label>Nome</label>
          <input type="text" id="authNome" placeholder="Seu nome" />
        </div>` : ""}

        <div class="field">
          <label>E-mail</label>
          <input type="email" id="authEmail" placeholder="seuemail@exemplo.com" />
        </div>

        <div class="field">
          <label>Senha</label>
          <input type="password" id="authSenha" placeholder="Mínimo 6 caracteres" />
        </div>

        <button class="auth-submit" id="authSubmitBtn">${isSignup ? "Criar conta" : "Entrar"}</button>
        <div id="authMsg"></div>

        <div class="auth-switch">
          ${isSignup ? "Já tem conta?" : "Ainda não tem conta?"}
          <button id="authSwitchBtn">${isSignup ? "Entrar" : "Criar conta"}</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("modalCloseBtn").onclick = closeAuthModal;
  document.getElementById("modalOverlay").onclick = (e)=>{ if(e.target.id==="modalOverlay") closeAuthModal(); };
  document.getElementById("authSwitchBtn").onclick = ()=>{ authMode = isSignup ? "login" : "signup"; renderAuthModal(); };
  document.getElementById("authSubmitBtn").onclick = isSignup ? handleSignup : handleLogin;
}

async function handleSignup(){
  const nome = document.getElementById("authNome").value.trim();
  const email = document.getElementById("authEmail").value.trim();
  const senha = document.getElementById("authSenha").value;
  const msgEl = document.getElementById("authMsg");
  msgEl.innerHTML = "";

  if(!email || !senha || senha.length<6){
    msgEl.innerHTML = '<p class="auth-error">Preencha e-mail e uma senha com pelo menos 6 caracteres.</p>';
    return;
  }

  try{
    const cfg = await getAuthConfig();
    const res = await fetch(`${cfg.supabaseUrl}/auth/v1/signup`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":cfg.supabaseAnonKey },
      body: JSON.stringify({ email, password: senha, data: { nome } })
    });
    const data = await res.json();
    if(!res.ok){
      msgEl.innerHTML = `<p class="auth-error">${data.msg || data.error_description || "Erro ao criar conta"}</p>`;
      return;
    }

    // notifica o dono do site por e-mail (não bloqueia o fluxo se falhar)
    fetch("/api/notify-signup", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email, nome })
    }).catch(()=>{});

    if(data.access_token){
      setSession({ access_token:data.access_token, user:data.user });
      closeAuthModal();
      await fetchUserPlano();
      renderAll();
    } else {
      msgEl.innerHTML = '<p class="auth-success">Conta criada! Verifique seu e-mail para confirmar antes de entrar.</p>';
    }
  }catch(e){
    msgEl.innerHTML = '<p class="auth-error">Erro de conexão. Tente novamente.</p>';
  }
}

async function handleLogin(){
  const email = document.getElementById("authEmail").value.trim();
  const senha = document.getElementById("authSenha").value;
  const msgEl = document.getElementById("authMsg");
  msgEl.innerHTML = "";

  if(!email || !senha){
    msgEl.innerHTML = '<p class="auth-error">Preencha e-mail e senha.</p>';
    return;
  }

  try{
    const cfg = await getAuthConfig();
    const res = await fetch(`${cfg.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":cfg.supabaseAnonKey },
      body: JSON.stringify({ email, password: senha })
    });
    const data = await res.json();
    if(!res.ok){
      msgEl.innerHTML = `<p class="auth-error">${data.error_description || data.msg || "E-mail ou senha incorretos"}</p>`;
      return;
    }
    setSession({ access_token:data.access_token, user:data.user });
    closeAuthModal();
    await fetchUserPlano();
    renderAll();
  }catch(e){
    msgEl.innerHTML = '<p class="auth-error">Erro de conexão. Tente novamente.</p>';
  }
}

function logout(){
  clearSession();
  userPlano = "free";
  renderAll();
}

function renderAccountArea(){
  const session = getSession();
  const btn = document.getElementById("accountBtn");
  const area = document.getElementById("accountArea");

  if(session && session.user){
    const nome = (session.user.user_metadata && session.user.user_metadata.nome) || session.user.email.split("@")[0];
    btn.style.display = "none";
    area.innerHTML = `
      <div class="account-card">
        <div class="account-avatar">${nome.charAt(0).toUpperCase()}</div>
        <div class="account-info">
          <div class="name">${nome}</div>
          <div class="email">${session.user.email}</div>
        </div>
        <button class="logout-btn" id="logoutBtn">Sair</button>
      </div>
    `;
    document.getElementById("logoutBtn").onclick = logout;
  } else {
    btn.style.display = "flex";
    btn.onclick = ()=>openAuthModal("login");
    area.innerHTML = "";
  }
}

// ===== PLANOS / STRIPE =====
const PLANS = [
  { id:"starter", nome:"Starter", preco:"R$ 9,90", periodo:"/mês", desc:"10 gerações por dia", priceId:"price_1U2wSzAdNZPVFECJyDjBVhlw", limite:10 },
  { id:"pro", nome:"Pro", preco:"R$ 19,90", periodo:"/mês", desc:"Gerações ilimitadas", priceId:"price_1U2wWBAdNZPVFECJocXPpv8T", limite:Infinity, destaque:true },
  { id:"anual", nome:"Anual", preco:"R$ 111,90", periodo:"/ano", desc:"Ilimitado + histórico + suporte prioritário", priceId:"price_1U2wX1AdNZPVFECJgmturYPs", limite:Infinity },
];

let plansOpen = false;
let userPlano = "free";

function planoLimite(){
  const plano = PLANS.find(p=>p.id===userPlano);
  return plano ? plano.limite : DAILY_LIMIT;
}

async function fetchUserPlano(){
  const session = getSession();
  if(!session) { userPlano = "free"; return; }
  try{
    const cfg = await getAuthConfig();
    const res = await fetch(`${cfg.supabaseUrl}/rest/v1/profiles?id=eq.${session.user.id}&select=plano`, {
      headers:{ apikey:cfg.supabaseAnonKey, Authorization:`Bearer ${session.access_token}` }
    });
    const data = await res.json();
    userPlano = (data && data[0] && data[0].plano) || "free";
  }catch(e){ userPlano = "free"; }
}

function renderPlans(){
  const area = document.getElementById("plansArea");
  const toggle = document.getElementById("plansToggle");
  if(!plansOpen){ area.innerHTML=""; toggle.textContent="💎 Ver planos premium"; return; }
  toggle.textContent="✕ Fechar planos";

  const cardsHtml = PLANS.map(p=>{
    const isCurrent = userPlano === p.id;
    return `
      <div class="plan-card ${p.destaque?"featured":""}">
        ${p.destaque?'<span class="plan-badge">MAIS POPULAR</span>':""}
        <p class="plan-name">${p.nome}</p>
        <p class="plan-price">${p.preco}<span>${p.periodo}</span></p>
        <p class="plan-desc">${p.desc}</p>
        ${isCurrent
          ? '<div class="plan-current">✓ Seu plano atual</div>'
          : `<button class="plan-btn ${p.destaque?"primary":""}" data-price="${p.priceId}">Assinar</button>`
        }
      </div>
    `;
  }).join("");

  area.innerHTML = `<div style="margin-top:6px;">${cardsHtml}</div>`;
  area.querySelectorAll("[data-price]").forEach(btn=>{
    btn.onclick = ()=>startCheckout(btn.getAttribute("data-price"));
  });
}

async function startCheckout(priceId){
  const session = getSession();
  if(!session){
    openAuthModal("login");
    return;
  }
  try{
    const res = await fetch("/api/create-checkout", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ priceId, email: session.user.email, userId: session.user.id })
    });
    const data = await res.json();
    if(data.url) window.location.href = data.url;
  }catch(e){
    alert("Erro ao iniciar pagamento. Tente novamente.");
  }
}

function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

function getRemaining(){
  const limit = planoLimite();
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return limit;
    const data = JSON.parse(raw);
    if(data.day !== todayKey()) return limit;
    return Math.max(0, limit - data.count);
  }catch(e){ return limit; }
}
function consumeGeneration(){
  const limit = planoLimite();
  const used = limit - getRemaining();
  localStorage.setItem(STORAGE_KEY, JSON.stringify({day:todayKey(), count: used+1}));
}

function renderChips(containerId, items, selectedKey, onSelect){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  items.forEach(item=>{
    const [id,label] = Array.isArray(item) ? item : [item,item];
    const btn = document.createElement("div");
    btn.className = "chip" + (id===selectedKey ? " active":"");
    btn.textContent = label;
    btn.onclick = ()=>{ onSelect(id); renderAll(); };
    el.appendChild(btn);
  });
}

function updateUsageUI(){
  const remaining = getRemaining();
  const limit = planoLimite();
  const limitLabel = limit===Infinity ? "∞" : limit;
  document.getElementById("usageLabel").textContent = (limit===Infinity?"Ilimitado":remaining+"/"+limitLabel);
  document.getElementById("usageBar").style.width = (limit===Infinity?100:(remaining/limit*100))+"%";
  return remaining;
}

function renderAction(){
  const remaining = updateUsageUI();
  const area = document.getElementById("actionArea");
  if(remaining<=0){
    area.innerHTML = '<div class="limit-box"><p>Você atingiu o limite diário de 5 gerações.</p><p>Volte amanhã para gerar mais conteúdo.</p></div>';
    return;
  }
  area.innerHTML = `
    <button class="generate-btn" id="genBtn" ${state.loading?"disabled":""}>
      ${state.loading ? '<span class="spin">⟳</span> Forjando conteúdo...' : '✨ GERAR CONTEÚDO'}
    </button>
    <div id="errorMsg"></div>
  `;
  document.getElementById("genBtn").onclick = generate;
}

function copyText(text, btn){
  navigator.clipboard.writeText(text).catch(()=>{});
  const original = btn.innerHTML;
  btn.innerHTML = "✓ Copiado";
  setTimeout(()=>{ btn.innerHTML = original; }, 1400);
}

function renderResults(){
  const area = document.getElementById("resultsArea");
  if(!state.result){ area.innerHTML=""; return; }
  const r = state.result;

  const card = (icon, title, copyStr, bodyHtml) => `
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="card-icon">${icon}</span>${title}</div>
        <button class="copy-btn" onclick='copyText(${JSON.stringify(copyStr)}, this)'>⧉ Copiar</button>
      </div>
      <div class="card-body">${bodyHtml}</div>
    </div>
  `;

  const titulosHtml = (r.titulos||[]).map((t,i)=>`<div class="titulo-item"><span class="titulo-num mono">${i+1}.</span><span>${t}</span></div>`).join("");
  const roteiroHtml = (r.roteiro||[]).map(s=>`<div class="roteiro-item"><span class="roteiro-time mono">${s.tempo}</span><span>${s.texto}</span></div>`).join("");
  const hashtagsHtml = `<div class="tag-list">${(r.hashtags||[]).map(h=>`<span class="tag">${h}</span>`).join("")}</div>`;
  const edicaoHtml = `<ul class="plain">${(r.ideiasEdicao||[]).map(i=>`<li>${i}</li>`).join("")}</ul>`;
  const textosHtml = `<div class="tag-list">${(r.textosNaTela||[]).map(t=>`<span class="screen-text">${t}</span>`).join("")}</div>`;

  area.innerHTML = `
    <div class="results">
      <div class="results-title"><span>⚡</span><h2 class="display">Conteúdo gerado</h2></div>
      ${card("🎯","3 TÍTULOS",(r.titulos||[]).join("\\n"),titulosHtml)}
      ${card("🪝","GANCHO",r.gancho||"",r.gancho||"")}
      ${card("📝","ROTEIRO",(r.roteiro||[]).map(s=>s.tempo+": "+s.texto).join("\\n"),roteiroHtml)}
      ${card("📄","DESCRIÇÃO",r.descricao||"",r.descricao||"")}
      ${card("#️⃣","HASHTAGS",(r.hashtags||[]).join(" "),hashtagsHtml)}
      ${card("📢","CTA",r.cta||"",r.cta||"")}
      ${card("✂️","IDEIAS DE EDIÇÃO",(r.ideiasEdicao||[]).join("\\n"),edicaoHtml)}
      ${card("📱","TEXTOS NA TELA",(r.textosNaTela||[]).join("\\n"),textosHtml)}
      ${getRemaining()>0 ? '<button class="regen-btn" id="regenBtn">⟳ Gerar novamente</button>' : ''}
    </div>
  `;
  const regenBtn = document.getElementById("regenBtn");
  if(regenBtn) regenBtn.onclick = generate;
}

async function generate(){
  if(getRemaining()<=0 || state.loading) return;
  state.loading = true;
  renderAction();
  const errorEl = document.getElementById("errorMsg");
  if(errorEl) errorEl.innerHTML = "";

  try{
    const res = await fetch("/api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        platform: PLATFORMS.find(p=>p[0]===state.platform)[1],
        niche: state.niche,
        theme: state.theme,
        duration: state.duration,
        style: state.style
      })
    });
    if(!res.ok) throw new Error("request failed");
    const data = await res.json();
    state.result = data;
    consumeGeneration();
    state.loading = false;
    renderAll();
    setTimeout(()=>{ document.querySelector(".results")?.scrollIntoView({behavior:"smooth", block:"start"}); }, 80);
  }catch(e){
    state.loading = false;
    renderAction();
    const errEl = document.getElementById("errorMsg");
    if(errEl) errEl.innerHTML = '<p class="error-msg">Não consegui gerar o conteúdo agora. Verifique sua conexão e tente novamente.</p>';
  }
}

function renderAll(){
  renderAccountArea();
  renderChips("platformChips", PLATFORMS, state.platform, v=>state.platform=v);
  renderChips("nicheChips", NICHES, state.niche, v=>state.niche=v);
  renderChips("durationChips", DURATIONS, state.duration, v=>state.duration=v);
  renderChips("styleChips", STYLES, state.style, v=>state.style=v);
  renderAction();
  renderResults();
  renderPlans();
}

document.getElementById("themeInput").addEventListener("input", e=>{ state.theme = e.target.value; });
document.getElementById("plansToggle").addEventListener("click", ()=>{ plansOpen = !plansOpen; renderAll(); });

(async function init(){
  await fetchUserPlano();
  renderAll();
})();
</script>
